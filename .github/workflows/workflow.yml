# Publication sur PyPI.
#
# IMPORTANT : ne pas renommer ce fichier ni l'environnement "release" :
# PyPI (Trusted Publisher) n'accepte que ce workflow et cet environnement.
#
# Pour publier une version :
#   1. fusionner dans `official` une PR qui met à jour src/mcp_server_grist/version.py
#      et CHANGELOG.md ;
#   2. créer une release GitHub dont le tag est `v<version>` (ex. v0.2.2), sur `official`.
# Un simple push sur `official` NE publie PAS.

name: Publish to PyPI

on:
  release:
    types: [published]
  # Relance manuelle (depuis la branche official uniquement)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/official')
    runs-on: ubuntu-latest

    # Configuration pour Trusted Publishers
    environment: release
    permissions:
      id-token: write  # IMPORTANT pour Trusted Publishers
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Vérifier la version avant publication
      env:
        EVENT: ${{ github.event_name }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/mcp_server_grist/version.py').read()).group(1))")
        echo "Version du code : $VERSION"

        if [ "$EVENT" = "release" ]; then
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Le tag '$TAG' ne correspond pas à la version du code ($VERSION). Attendu : v$VERSION"
            exit 1
          fi
          git fetch origin official
          if ! git merge-base --is-ancestor HEAD origin/official; then
            echo "::error::Le tag '$TAG' ne pointe pas sur un commit de la branche official."
            exit 1
          fi
        fi

        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/mcp-server-grist/$VERSION/json")
        if [ "$STATUS" = "200" ]; then
          echo "::error::La version $VERSION est déjà publiée sur PyPI. Augmentez la version dans src/mcp_server_grist/version.py."
          exit 1
        fi

    - name: Build package
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
        ls -la dist/

    - name: Publish to PyPI using Trusted Publishers
      uses: pypa/gh-action-pypi-publish@release/v1
